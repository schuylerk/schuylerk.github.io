<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>schuylerk.github.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #8888aa; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    a {
      display: block;
      padding: 1rem 1.5rem;
      background: #1a1a2e;
      color: #e8e8f0;
      text-decoration: none;
      border-radius: 12px;
      border: 1px solid #2d2d4a;
      transition: background .2s, border-color .2s;
    }
    a:hover { background: #252542; border-color: #6366f1; }
  </style>
</head>
<body>
  <h1>项目导航</h1>
  <nav>
    <a href="./gif-gen/">GIF 生成</a>
    <a href="./matting/">抠图工具</a>
  </nav>
</body>
</html>
