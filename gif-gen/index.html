<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gif生成</title>
    <script type="module" crossorigin src="/pngseqframe/assets/index-cfB_fj5O.js"></script>
    <link rel="stylesheet" crossorigin href="/pngseqframe/assets/index-DPO0qFq3.css">
  </head>
  <body>
    <div class="app">
      <header>
        <h1>GIF 生成</h1>
        <p class="desc">选择多个 PNG 或选择文件夹（读取该文件夹下所有 PNG）→ 预览动画 → 导出 GIF</p>
      </header>

      <section class="upload">
        <label class="zone" id="dropZone">
          <input type="file" id="fileInput" accept="image/png,.png" multiple hidden />
          <span class="zone-text">点击选择多个 PNG，或拖拽到此处</span>
        </label>
        <div class="upload-actions">
          <button type="button" class="btn-folder" id="btnFolder">选择文件夹</button>
          <input type="file" id="dirInput" webkitdirectory directory accept="image/png,.png" multiple hidden />
        </div>
      </section>

      <section class="controls" id="controls" hidden>
        <label>FPS <input type="number" id="fps" min="1" max="60" value="12" /></label>
        <button type="button" id="btnPlay">播放</button>
        <button type="button" id="btnExport">导出 GIF</button>
        <span class="info" id="frameInfo"></span>
      </section>

      <section class="preview">
        <div class="preview-wrap" id="previewWrap">
          <canvas id="canvas"></canvas>
          <p class="empty" id="emptyTip">请先选择多个 PNG 文件</p>
        </div>
      </section>
    </div>
  </body>
</html>
